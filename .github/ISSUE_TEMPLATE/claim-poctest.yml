# claim.yml - 수업 입장 신청 이슈 폼 (원천 틀)
# poctest 자리를 과목명으로 치환해 claim-<과목>.yml로 배포한다 —
# 배포는 classroom_deploy.py register가, 회수는 unregister가 수행한다.
# 배포 위치는 startksdc(공개) .github/ISSUE_TEMPLATE/claim-<과목>.yml이다.
# QR과 랜딩이 여는 주소가 이 폼과 제목을 함께 지정한다.
# 실측 확정 규격(2026-08-15): 폼에는 markdown 아닌 요소 1개와 그 label이 필수다.
name: poctest 수업 입장 신청
description: 수업 QR로 들어온 입장 신청입니다
title: "claim: poctest"
body:
  - type: checkboxes
    id: ack
    attributes:
      label: 아래 초록 Create 버튼을 누르면 "poctest 수업" 신청이 접수됩니다
      description: 누른 후에는 아래에 답글이 생길 때까지 기다리면 됩니다
      options:
        - label: 확인 (선택)
