# QR이 여는 주소가 이 폼과 제목을 함께 지정한다:
#   https://github.com/<ORGANIZATION>/startksdc/issues/new?template=claim.yml&title=claim%3A%20<assignment>
name: 수업 입장 신청
description: 수업 QR로 들어온 입장 신청입니다
title: "claim: "
body:
  - type: markdown
    attributes:
      value: |
        수업 입장 신청 화면입니다. 아무것도 쓰지 말고 **아래 초록 Create 버튼**을 누르면 접수됩니다.
        접수되면 이 화면에 안내 답글이 달리고, GitHub 가입 메일함으로 저장소 초대가 발송됩니다.
