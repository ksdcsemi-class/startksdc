# claim.yml - startksdc claim 처리 엔진 (원천)
# 배포 위치는 startksdc(공개) .github/workflows/claim.yml이다.
# 이슈 본문과 제목은 데이터로만 다룬다 (env 경유, 스크립트 보간 금지).
# 로그 규율: repo 이름 외의 학생 정보를 출력하지 않는다.
# 판정 원천: registry.cfg(등재·정원)와 repo 실물뿐이다 — 장부(ledger.jsonl)·좌석 번호·
#   명부 자동 등재(helloksdc)는 A단계 재배선으로 퇴역했다 (2026-08-18, learn-enrollment-design).
#   신원·키는 KSDC Learn 명부가 정본이고, 상세 안내는 provisioning 후 Learn 메일이 담당한다.
# 구조: process(직렬 — 생성 경합 차단)와 cleanup(병렬 — 지연 삭제)을 분리한다.
#   삭제 대기가 직렬 구간을 점유하면 처리량이 1건/5분으로 떨어지기 때문이다 (2026-08-15 실측).
name: claim

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    concurrency:
      group: claim-engine
      cancel-in-progress: false
    outputs:
      node: ${{ steps.claim.outputs.node }}
    steps:
      - name: claim 처리
        id: claim
        env:
          GH_TOKEN: ${{ secrets.CLASSROOM_OPS_TOKEN }}
          ORG: ${{ github.repository_owner }}
          ENTRY: ${{ github.event.repository.name }}
          REGISTRY_REPO: startksdc-ledger
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}
          NODE: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail

          reply() {
            gh api "repos/$ORG/$ENTRY/issues/$NUM/comments" -f body="$1" --silent
          }
          # 무잔류: 삭제는 cleanup job의 몫이다 — 여기서는 대상만 넘기고 즉시 끝난다
          finish() {
            echo "node=$NODE" >> "$GITHUB_OUTPUT"
            exit 0
          }
          registry_get() {
            gh api "repos/$ORG/$REGISTRY_REPO/contents/registry.cfg" --jq .content 2>/dev/null | base64 -d || true
          }
          create_and_invite() {
            local tpl="$1" repo="$2"
            gh api -X POST "repos/$ORG/$tpl/generate" \
              -f owner="$ORG" -f name="$repo" -F private=true --silent
            gh api -X PUT "repos/$ORG/$repo/collaborators/$AUTHOR" \
              -f permission=push --silent
          }

          # 1. 제목 검증 - claim이 아닌 이슈도 안내 후 같은 무잔류 경로로 정리한다
          ASSIGN=$(printf '%s' "$TITLE" | sed -n 's/^claim: *\([a-z0-9][a-z0-9-]*\) *$/\1/p')
          if [ -z "$ASSIGN" ]; then
            reply "이 저장소는 수업 입장 신청 전용입니다."$'\n'"수업 QR로 다시 접수하십시오."
            finish
          fi
          # 2026B 과목명 전환 — 이미 배포된 old URL과 직접 issue 링크도 새 repo 이름으로 정규화한다.
          if [ "$ASSIGN" = "semiconintro-dyc2026b-kyu" ]; then
            ASSIGN="semiconai2026b-kyu"
          fi
          echo "claim 접수: 제목 형식 통과"

          # 2. 등록 확인 - 등록 목록은 registry.cfg다
          REGISTRY=$(registry_get)
          LINE=$(printf '%s\n' "$REGISTRY" | sed -n "s/^$ASSIGN *= *//p" | head -1)
          if [ -z "$LINE" ]; then
            reply "접수 대상이 아닌 신청입니다."$'\n'"수업 QR로 다시 접수하십시오."
            finish
          fi
          TEMPLATE=$(printf '%s' "$LINE" | cut -d, -f1 | tr -d ' ')
          SEATS=$(printf '%s' "$LINE" | sed -n 's/.*SEATS *\([0-9][0-9]*\).*/\1/p')
          REPO="$ASSIGN-$AUTHOR"

          # 3. 중복 검사 - 이미 있으면 생성 없이 초대만 재발송한다 (멱등)
          if gh api "repos/$ORG/$REPO" --silent 2>/dev/null; then
            gh api -X PUT "repos/$ORG/$REPO/collaborators/$AUTHOR" -f permission=push --silent || true
            reply "이미 접수된 신청입니다."$'\n'"**초대를 다시 보냈습니다.**"$'\n'"저장소를 열어 **Accept invitation**을 누르십시오."$'\n'"https://github.com/$ORG/$REPO"
            finish
          fi

          # 4. 정원 검사 - 점유 수는 repo 실물 수다 (SEATS 0은 무제한, template 사본 제외)
          if [ "${SEATS:-0}" -gt 0 ]; then
            COUNT=$(gh repo list "$ORG" --limit 1000 --json name --jq '.[].name' \
              | grep "^$ASSIGN-" | grep -vc "template" || true)
            if [ "$COUNT" -ge "$SEATS" ]; then
              reply "정원이 마감된 수업입니다."$'\n'"담당 교수에게 문의하십시오."
              finish
            fi
          fi

          # 5. 생성과 초대
          create_and_invite "$TEMPLATE" "$REPO"

          # 6. 안내 답글 - 결과와 다음 한 걸음만 말한다 (#N 표기는 이슈 링크로 오렌더링되므로 금지)
          reply "접수 완료."$'\n'"아래의 저장소를 열어 녹색 버튼 **Accept invitation**을 누르십시오."$'\n'"https://github.com/$ORG/$REPO"$'\n'"수업 상세 안내는 KSDC Learn(learn.ksdcsemi.com) 가입 이메일로 발송됩니다."
          finish

  cleanup:
    needs: process
    if: ${{ needs.process.outputs.node != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: 지연 삭제 (무잔류)
        env:
          GH_TOKEN: ${{ secrets.CLASSROOM_OPS_TOKEN }}
          NODE: ${{ needs.process.outputs.node }}
          DELETE_DELAY_SECONDS: "300"
        run: |
          sleep "$DELETE_DELAY_SECONDS"
          gh api graphql \
            -f query='mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { clientMutationId } }' \
            -F id="$NODE" --silent || true
